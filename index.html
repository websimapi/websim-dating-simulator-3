<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <div class="main-container">
            <div v-if="currentScreen === 'start'" class="start-screen">
                <h1>Love Connection</h1>
                <p>Select a character to date</p>
                <div class="character-selection">
                    <div v-for="character in characters" :key="character.id" class="character-card" @click="selectCharacter(character)">
                        <div class="character-image-container">
                            <img :src="character.image || 'placeholder.png'" alt="Character image" @error="generateCharacterImage(character)" class="character-image">
                        </div>
                        <h3>{{ character.name }}</h3>
                        <p>{{ character.bio }}</p>
                    </div>
                </div>
            </div>

            <div v-else-if="currentScreen === 'date'" class="date-screen">
                <div class="location-image-container">
                    <img :src="currentLocation.image || 'placeholder.png'" alt="Location image" @error="generateLocationImage(currentLocation)" class="location-image">
                </div>
                
                <div class="character-container">
                    <img :src="selectedCharacter.image || 'placeholder.png'" alt="Character image" @error="generateCharacterImage(selectedCharacter)" class="date-character-image">
                </div>
                
                <div class="chat-container">
                    <div class="chat-messages" ref="chatMessages">
                        <div v-for="message in messages" :key="message.id" :class="['message', message.from === 'user' ? 'user-message' : 'character-message']">
                            <p>{{ message.text }}</p>
                        </div>
                    </div>
                    
                    <div class="chat-input">
                        <input type="text" v-model="userInput" @keyup.enter="sendMessage" placeholder="Type your message...">
                        <button @click="sendMessage">Send</button>
                    </div>
                </div>

                <div class="date-controls">
                    <button @click="goToStart">Back to Selection</button>
                    <button @click="changeLocation">Change Location</button>
                    <div class="tts-toggle">
                        <label>
                            <input type="checkbox" v-model="ttsEnabled">
                            Text-to-Speech
                        </label>
                    </div>
                </div>
            </div>

            <div v-else-if="currentScreen === 'location'" class="location-screen">
                <h2>Choose a Location</h2>
                <div class="location-selection">
                    <div v-for="location in locations" :key="location.id" class="location-card" @click="selectLocation(location)">
                        <div class="location-image-container">
                            <img :src="location.image || 'placeholder.png'" alt="Location image" @error="generateLocationImage(location)" class="location-preview">
                        </div>
                        <h3>{{ location.name }}</h3>
                        <p>{{ location.description }}</p>
                    </div>
                </div>
                <button @click="backToDate" class="back-button">Back</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>

</body>
</html>
